<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Düğün Davetiyesi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary:  #7B1E2E;
      --gold:     #C9A036;
      --gold-lt:  #e8c96a;
      --cream:    #FDF6E3;
      --dark:     #2a1208;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--primary);
      font-family: 'Lato', sans-serif;
      color: var(--dark);
      overflow-x: hidden;
    }

    /* ── Petals ─────────────────────────────────────────────────────── */
    .petal-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .petal {
      position: absolute;
      width: 14px; height: 14px;
      border-radius: 0 80% 0 80%;
      background: var(--gold-lt);
      opacity: 0;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0%   { opacity: 0; transform: translateY(-60px) rotate(0deg); }
      10%  { opacity: .7; }
      90%  { opacity: .5; }
      100% { opacity: 0; transform: translateY(105vh) rotate(720deg); }
    }

    /* ── Outer card ─────────────────────────────────────────────────── */
    .page {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 32px 16px 64px;
    }

    .card {
      background: var(--cream);
      border-radius: 4px;
      max-width: 520px;
      width: 100%;
      box-shadow:
        0 0 0 8px rgba(201,160,54,.3),
        0 0 0 16px rgba(201,160,54,.12),
        0 32px 80px rgba(0,0,0,.5);
      animation: cardIn .9s ease both;
      overflow: hidden;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(40px) scale(.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }

    /* ── Top ornament ───────────────────────────────────────────────── */
    .ornament-top {
      background: linear-gradient(135deg, var(--primary), #4a0e1a);
      padding: 36px 24px 28px;
      text-align: center;
      position: relative;
    }
    .ornament-top::after {
      content: '';
      display: block;
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin-top: 24px;
    }
    .ornament-title {
      font-family: 'Playfair Display', serif;
      color: var(--gold-lt);
      font-size: .8rem;
      letter-spacing: .35em;
      text-transform: uppercase;
      margin-bottom: 6px;
      animation: fadeUp .8s .2s both;
    }
    .arabic-ornament {
      font-size: 2.2rem;
      color: var(--gold);
      line-height: 1;
      animation: fadeUp .8s .3s both;
      margin-bottom: 8px;
    }
    .dear-guest {
      color: rgba(255,255,255,.8);
      font-size: .95rem;
      font-weight: 300;
      animation: fadeUp .8s .4s both;
    }
    .dear-guest strong { color: white; font-weight: 400; }

    /* ── Names ──────────────────────────────────────────────────────── */
    .names-block {
      padding: 36px 24px 24px;
      text-align: center;
    }
    .name {
      font-family: 'Great Vibes', cursive;
      font-size: 3.6rem;
      color: var(--primary);
      line-height: 1.1;
      animation: fadeUp .8s .5s both;
    }
    .ampersand {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: var(--gold);
      font-size: 2rem;
      margin: 8px 0;
      animation: fadeUp .8s .55s both;
    }
    .name.groom { animation-delay: .6s; }

    /* ── Divider ────────────────────────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 32px;
      margin: 4px 0 24px;
      animation: fadeUp .8s .65s both;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold));
    }
    .divider::after { background: linear-gradient(to left, transparent, var(--gold)); }
    .divider-icon { font-size: 1.4rem; }

    /* ── Details ────────────────────────────────────────────────────── */
    .details {
      padding: 0 32px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .detail-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      animation: fadeUp .8s both;
    }
    .detail-row:nth-child(1) { animation-delay: .7s; }
    .detail-row:nth-child(2) { animation-delay: .78s; }
    .detail-row:nth-child(3) { animation-delay: .86s; }
    .detail-icon {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #4a0e1a);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(123,30,46,.3);
    }
    .detail-text { line-height: 1.4; }
    .detail-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--gold); font-weight: 700; }
    .detail-value { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--dark); margin-top: 2px; }
    .detail-sub   { font-size: .82rem; color: #6a5040; margin-top: 1px; }

    /* ── RSVP section ───────────────────────────────────────────────── */
    .rsvp-block {
      background: linear-gradient(135deg, #fdf0e0, #f9e8c8);
      border-top: 1px solid rgba(201,160,54,.3);
      padding: 32px 24px 36px;
      text-align: center;
    }
    .rsvp-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      color: var(--primary);
      margin-bottom: 4px;
      animation: fadeUp .8s .95s both;
    }
    .rsvp-sub {
      font-size: .82rem;
      color: #7a5a40;
      margin-bottom: 24px;
      animation: fadeUp .8s 1s both;
    }
    .rsvp-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      animation: fadeUp .8s 1.05s both;
    }
    .rsvp-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 16px 24px;
      border-radius: 12px;
      border: 2px solid transparent;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      font-size: .9rem;
      transition: all .25s;
      min-width: 110px;
      background: white;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }
    .rsvp-btn .emoji { font-size: 2rem; line-height: 1; }
    .rsvp-btn:hover  { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,.15); }
    .rsvp-btn:active { transform: translateY(0); }

    .rsvp-btn.yes   { border-color: #2d6a2d; color: #2d6a2d; }
    .rsvp-btn.yes:hover   { background: #e8f5e9; }
    .rsvp-btn.yes.selected   { background: #2d6a2d; color: white; }

    .rsvp-btn.no    { border-color: #b71c1c; color: #b71c1c; }
    .rsvp-btn.no:hover    { background: #fce4ec; }
    .rsvp-btn.no.selected    { background: #b71c1c; color: white; }

    .rsvp-btn.maybe { border-color: #e65100; color: #e65100; }
    .rsvp-btn.maybe:hover { background: #fff3e0; }
    .rsvp-btn.maybe.selected { background: #e65100; color: white; }

    .rsvp-btn:disabled { opacity: .5; cursor: not-allowed; transform: none !important; }

    /* ── Confirmation ────────────────────────────────────────────────── */
    #confirm-msg {
      display: none;
      margin-top: 24px;
      padding: 16px 20px;
      border-radius: 10px;
      background: white;
      border-left: 4px solid var(--gold);
      text-align: left;
      animation: fadeUp .5s both;
    }
    #confirm-msg .conf-title { font-weight: 700; color: var(--primary); margin-bottom: 4px; }
    #confirm-msg .conf-sub   { font-size: .85rem; color: #6a5040; }
    #confirm-msg .conf-wa    {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 12px; padding: 10px 18px;
      background: #25D366; color: white;
      border-radius: 8px; text-decoration: none;
      font-size: .88rem; font-weight: 600;
      transition: background .2s;
    }
    #confirm-msg .conf-wa:hover { background: #1ebe57; }

    /* ── Footer ─────────────────────────────────────────────────────── */
    .footer-ornament {
      background: linear-gradient(135deg, var(--primary), #4a0e1a);
      padding: 20px 24px;
      text-align: center;
    }
    .footer-ornament::before {
      content: '';
      display: block;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin-bottom: 16px;
    }
    .footer-text {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: rgba(240,217,122,.8);
      font-size: .88rem;
    }

    /* ── Shared animations ───────────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Error / loading ─────────────────────────────────────────────── */
    .loading {
      text-align: center;
      padding: 80px 24px;
      color: var(--gold-lt);
    }
    .loading .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(201,160,54,.3);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-state {
      text-align: center;
      padding: 80px 24px;
      color: rgba(255,255,255,.7);
    }
    .error-state h2 { color: white; font-family: 'Playfair Display', serif; margin-bottom: 12px; }

    /* ── Music button ────────────────────────────────────────────────── */
    #music-btn {
      position: fixed;
      top: 16px; right: 16px;
      z-index: 200;
      width: 46px; height: 46px;
      border-radius: 50%;
      background: rgba(123,30,46,.8);
      backdrop-filter: blur(10px);
      color: var(--gold-lt);
      font-size: 1.3rem;
      border: 2px solid var(--gold);
      cursor: pointer;
      transition: all .2s;
      display: flex; align-items: center; justify-content: center;
    }
    #music-btn:hover { background: rgba(74,14,26,.95); transform: scale(1.1); }
    #music-btn.playing { animation: musicPulse 1.5s ease-in-out infinite; }
    @keyframes musicPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(201,160,54,.5); }
      50%     { box-shadow: 0 0 0 10px rgba(201,160,54,0); }
    }

    /* ── Preview banner ──────────────────────────────────────────────── */
    #preview-banner {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(201,160,54,.95);
      color: #2a1208;
      text-align: center;
      padding: 8px 16px;
      font-size: .82rem;
      font-weight: 700;
      z-index: 300;
      letter-spacing: .05em;
    }
  </style>
</head>
<body>

<div id="preview-banner">👁 VORSCHAU-MODUS · Kein echter Gast · Keine RSVP-Funktion aktiv</div>

<!-- Music toggle -->
<button id="music-btn" onclick="toggleMusic()" title="Musik an/aus">🎵</button>
<!--
  🎵 MUSIK HINZUFÜGEN:
  Laden Sie eine .mp3-Datei hoch und ersetzen Sie die leere src-URL.
  Beispiel: <source src="/music/wedding.mp3" type="audio/mpeg">
-->
<audio id="bg-music" loop preload="none">
  <source src="" type="audio/mpeg">
</audio>

<!-- Floating petals -->
<div class="petal-canvas" id="petals"></div>

<div class="page">
  <div id="root">
    <div class="card">
      <div class="loading">
        <div class="spinner"></div>
        Davetiye yükleniyor… / Einladung wird geladen…
      </div>
    </div>
  </div>
</div>

<script>
// ── Petals ────────────────────────────────────────────────────────────────
(function spawnPetals() {
  const canvas = document.getElementById('petals');
  const colors = ['#C9A036','#e8c96a','#f0d27a','#d4b040','#7B1E2E','#a03048'];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left     = Math.random() * 100 + 'vw';
    p.style.top      = -20 + 'px';
    p.style.width    = (8 + Math.random() * 12) + 'px';
    p.style.height   = (8 + Math.random() * 12) + 'px';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDuration  = (6 + Math.random() * 10) + 's';
    p.style.animationDelay     = (Math.random() * 12) + 's';
    p.style.opacity = '0';
    canvas.appendChild(p);
  }
})();

// ── Music ─────────────────────────────────────────────────────────────────
function toggleMusic() {
  const audio = document.getElementById('bg-music');
  const btn   = document.getElementById('music-btn');
  const src   = audio.querySelector('source').getAttribute('src');
  if (!src) {
    btn.title = 'Keine Musik konfiguriert — bitte .mp3-Pfad in invite.html eintragen';
    btn.textContent = '🚫';
    setTimeout(() => { btn.textContent = '🎵'; btn.title = 'Musik an/aus'; }, 2000);
    return;
  }
  if (audio.paused) {
    audio.play().then(() => { btn.textContent = '🔇'; btn.classList.add('playing'); });
  } else {
    audio.pause();
    btn.textContent = '🎵';
    btn.classList.remove('playing');
  }
}

// ── Load data ─────────────────────────────────────────────────────────────
const params    = new URLSearchParams(location.search);
const token     = params.get('token');
const isPreview = params.get('preview') === '1';

if (isPreview) {
  document.getElementById('preview-banner').style.display = 'block';
  fetch('/api/event')
    .then(r => r.json())
    .then(ev => render({ guest: { name: 'Vorschau-Gast', rsvp: 'pending', token: 'preview' }, event: ev }))
    .catch(() => showError('Ereignis nicht konfiguriert.', 'Etkinlik ayarlanmamış.'));
} else if (!token) {
  showError('Kein Einladungstoken gefunden.', 'Token bulunamadı.');
} else {
  fetch(`/api/invite/${token}`)
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(render)
    .catch(() => showError('Einladung nicht gefunden.', 'Davetiye bulunamadı.'));
}

// ── Render ────────────────────────────────────────────────────────────────
function render({ guest, event }) {
  const root = document.getElementById('root');

  const alreadyRsvp = guest.rsvp !== 'pending' && !isPreview;
  const rsvpLabels = {
    yes:   { de: 'Du hast zugesagt',      tr: 'Katılacaksınız' },
    no:    { de: 'Du hast abgesagt',       tr: 'Katılamayacaksınız' },
    maybe: { de: 'Du bist noch unsicher',  tr: 'Belki katılırsınız' }
  };

  document.title = `${event.bride_name} & ${event.groom_name} — Düğün Davetiyesi`;

  root.innerHTML = `
  <div class="card">

    <!-- Top ornament -->
    <div class="ornament-top">
      <div class="ornament-title">Düğün Davetiyesi · Hochzeitseinladung</div>
      <div class="arabic-ornament">✦ ❁ ✦</div>
      <div class="dear-guest">
        Sayın / Liebe·r <strong>${esc(guest.name)}</strong>,<br>
        <span style="font-size:.85rem">sizi düğünümüze davet etmekten onur duyuyoruz.</span>
      </div>
    </div>

    <!-- Names -->
    <div class="names-block">
      <div class="name bride">${esc(event.bride_name)}</div>
      <div class="ampersand">&amp;</div>
      <div class="name groom">${esc(event.groom_name)}</div>
    </div>

    <!-- Divider -->
    <div class="divider"><span class="divider-icon">💍</span></div>

    <!-- Details -->
    <div class="details">
      <div class="detail-row">
        <div class="detail-icon">📅</div>
        <div class="detail-text">
          <div class="detail-label">Tarih · Datum</div>
          <div class="detail-value">${esc(event.event_date)}</div>
        </div>
      </div>
      <div class="detail-row">
        <div class="detail-icon">⏰</div>
        <div class="detail-text">
          <div class="detail-label">Saat · Uhrzeit</div>
          <div class="detail-value">${esc(event.event_time)}</div>
        </div>
      </div>
      <div class="detail-row">
        <div class="detail-icon">📍</div>
        <div class="detail-text">
          <div class="detail-label">Mekan · Veranstaltungsort</div>
          <div class="detail-value">${esc(event.venue_name)}</div>
          ${event.venue_address ? `<div class="detail-sub">${esc(event.venue_address)}</div>` : ''}
        </div>
      </div>
    </div>

    <!-- RSVP -->
    <div class="rsvp-block">
      <div class="rsvp-title">Katılım Durumunuzu Bildirin</div>
      <div class="rsvp-sub">Bitte teilen Sie uns Ihre Antwort mit · Lütfen cevap veriniz</div>

      ${isPreview ? `<div style="background:rgba(201,160,54,.15); border:1px dashed var(--gold); border-radius:8px; padding:10px; font-size:.8rem; color:#7a5a40; margin-bottom:16px">👁 Vorschau — RSVP-Buttons im echten Einsatz aktiv</div>` : ''}
      <div class="rsvp-buttons" id="rsvp-btns">
        <button class="rsvp-btn yes   ${alreadyRsvp && guest.rsvp==='yes'   ? 'selected':''}" onclick="rsvp('yes',   this)" ${alreadyRsvp||isPreview?'disabled':''}>
          <span class="emoji">✅</span>Zusage<br><small style="font-weight:300">Katılacağım</small>
        </button>
        <button class="rsvp-btn no    ${alreadyRsvp && guest.rsvp==='no'    ? 'selected':''}" onclick="rsvp('no',    this)" ${alreadyRsvp||isPreview?'disabled':''}>
          <span class="emoji">❌</span>Absage<br><small style="font-weight:300">Katılamayacağım</small>
        </button>
        <button class="rsvp-btn maybe ${alreadyRsvp && guest.rsvp==='maybe' ? 'selected':''}" onclick="rsvp('maybe', this)" ${alreadyRsvp||isPreview?'disabled':''}>
          <span class="emoji">🤔</span>Vielleicht<br><small style="font-weight:300">Belki</small>
        </button>
      </div>

      <div id="confirm-msg" ${alreadyRsvp ? 'style="display:block"' : ''}>
        ${alreadyRsvp ? buildConfirmHtml(guest.rsvp, rsvpLabels, event.host_phone, guest.name) : ''}
      </div>
    </div>

    <!-- Footer -->
    <div class="footer-ornament">
      <div class="footer-text">
        Sizi aramızda görmekten mutluluk duyarız 🌹<br>
        Wir freuen uns sehr auf Euch · ${esc(event.bride_name)} &amp; ${esc(event.groom_name)}
      </div>
    </div>
  </div>`;
}

function buildConfirmHtml(status, labels, hostPhone, guestName) {
  const waTexts = {
    yes:   encodeURIComponent(`✅ Katılacağım! Ich sage gerne zu! 🎉 (${guestName})`),
    no:    encodeURIComponent(`❌ Üzgünüm, katılamayacağım. Ich muss leider absagen. 😔 (${guestName})`),
    maybe: encodeURIComponent(`🤔 Belki katılırım, tekrar yazacağım. Ich bin noch unsicher. (${guestName})`)
  };
  const icons  = { yes:'✅', no:'❌', maybe:'🤔' };
  const colors = { yes:'#2d6a2d', no:'#b71c1c', maybe:'#e65100' };
  const label  = labels[status];
  const waNum  = hostPhone ? waPhone(hostPhone) : '';
  const waLink = waNum ? `https://wa.me/${waNum}?text=${waTexts[status]}` : null;

  return `
    <div class="conf-title" style="color:${colors[status]}">${icons[status]} ${label.de}</div>
    <div class="conf-sub">${label.tr} — vielen Dank! / Teşekkür ederiz!</div>
    ${waLink ? `<a class="conf-wa" href="${waLink}" target="_blank">💬 Über WhatsApp bestätigen · WhatsApp ile onayla</a>` : ''}
  `;
}

// ── RSVP action ───────────────────────────────────────────────────────────
async function rsvp(status, btn) {
  if (isPreview) return;
  const btns = document.querySelectorAll('.rsvp-btn');
  btns.forEach(b => b.disabled = true);

  try {
    const res = await fetch(`/api/rsvp/${token}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status })
    });
    const data = await res.json();

    // Highlight selected button
    btns.forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');

    const rsvpLabels = {
      yes:   { de: 'Du hast zugesagt',      tr: 'Katılacaksınız' },
      no:    { de: 'Du hast abgesagt',       tr: 'Katılamayacaksınız' },
      maybe: { de: 'Du bist noch unsicher',  tr: 'Belki katılırsınız' }
    };

    const confDiv = document.getElementById('confirm-msg');
    confDiv.innerHTML = buildConfirmHtml(status, rsvpLabels, data.hostPhone, data.guestName);
    confDiv.style.display = 'block';

    // Auto-open WhatsApp after short delay
    const waLink = confDiv.querySelector('.conf-wa');
    if (waLink) setTimeout(() => { waLink.click(); }, 1200);

  } catch (e) {
    btns.forEach(b => b.disabled = false);
    alert('Fehler: ' + e.message);
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function waPhone(phone) {
  let n = phone.replace(/\D/g, '');
  if (n.startsWith('00')) n = n.slice(2);
  else if (n.startsWith('0')) n = '49' + n.slice(1);
  return n;
}

function showError(de, tr) {
  document.getElementById('root').innerHTML = `
    <div class="card">
      <div class="error-state">
        <h2>🌹 Einladung nicht gefunden</h2>
        <p>${de}<br>${tr}</p>
      </div>
    </div>`;
}
</script>
</body>
</html>
