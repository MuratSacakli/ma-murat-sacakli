services:
  salon-assistant:
    build: .
    container_name: salon-assistant
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - salon-data:/data          # Datenbank persistent
    environment:
      - DATABASE_URL=sqlite:////data/salon_booking.db
      - SECRET_KEY=${SECRET_KEY:-bitte-aendern}
      # Fallback-Werte — werden im Dashboard überschrieben
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - BASE_URL=${BASE_URL:-http://localhost:8000}

volumes:
  salon-data:
